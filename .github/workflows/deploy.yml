name: Deploy Static Production
on:
  push:
    branches:
      - main

# ----------------------------------------------------------------------
# ⚙️ VARIABLES DEL PROYECTO
# ----------------------------------------------------------------------
env:
  DEPLOY_PATH: "/home/runcloud/webapps/lautarodesouches-com"
  PNPM_VERSION: "10"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Obtener código
        uses: actions/checkout@v4

      - name: 2. Instalar PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 3. Configurar Node.js (Solo Build)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 4. Instalar y Compilar
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          # Al usar output: 'export', el resultado estará en la carpeta 'out'

      - name: 5. Preparar Artefactos (Tarball)
        run: |
          # Comprimir la carpeta 'out' (Next.js static export default)
          # -C out . hace que el contenido quede en la raíz del tar
          tar -czf deploy.tar.gz -C out .

      - name: 6. Transferir archivos
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: runcloud
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "deploy.tar.gz"
          target: "${{ env.DEPLOY_PATH }}"

      - name: 7. Instalar en Servidor
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: runcloud
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd "${{ env.DEPLOY_PATH }}"

            if [ -f "deploy.tar.gz" ]; then
              echo "📦 Encontrado deploy.tar.gz. Limpiando versiones anteriores..."
              # Borrar todo EXCEPTO deploy.tar.gz
              # (Asumimos que la carpeta raíz sirve el sitio estático)
              find . -maxdepth 1 ! -name 'deploy.tar.gz' ! -name '.' ! -name '..' -exec rm -rf {} +
              
              echo "📦 Extrayendo nueva versión..."
              tar -xzf deploy.tar.gz
              rm deploy.tar.gz
            else
              echo "⚠️ deploy.tar.gz no encontrado."
              exit 1
            fi

            echo "✅ Sitio estático desplegado."
